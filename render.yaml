services:
  - type: web
    name: ewgcet-landfill-tracker
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ewgcet-db
          property: connectionString

databases:
  - name: ewgcet-db
    plan: free
